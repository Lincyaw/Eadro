[project]
name = "eadro"
version = "0.1.0"
description = "End-to-End Troubleshooting Framework for Microservices on Multi-source Data"
readme = "Readme.md"
requires-python = ">=3.8,<3.9"
license = { text = "MIT" }
authors = [
    { name = "Eadro Team" }
]
keywords = ["microservices", "troubleshooting", "anomaly-detection", "root-cause-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.21.5,<1.24",
    "pandas>=1.4.2,<2.0",
    "scikit-learn>=1.1.2,<1.2",
    "torch>=1.12.1,<1.13",
    "dgl>=0.9.1,<0.10",
    "tick>=0.7.0.1,<0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "isort>=5.10",
    "mypy>=0.950",
    "flake8>=4.0",
]
preprocess = [
    "drain3>=0.9.6",
]

[project.scripts]
eadro-train = "eadro.cli:main"

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eadro = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["eadro"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=eadro --cov-report=term-missing"

[tool.uv]
# index-url = "https://mirrors.tencent.com/repository/pypi/tencent_pypi/simple"
index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"


[tool.uv.sources]
# DGL 0.9.1 for Python 3.8 (CPU version)
